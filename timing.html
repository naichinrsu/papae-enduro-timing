<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบจับเวลาหน้างาน - ป่าแป๋เอ็นดูโร่</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Library กล้องสแกน QR Code (html5-qrcode) -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: 'Kanit', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-3 md:p-6 select-none">
  <div class="max-w-xl mx-auto space-y-4">
    
    <!-- Top Bar: สถานะ Online / Offline & จุดคุมเวลา -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
      <div class="flex justify-between items-center mb-3">
        <div class="flex items-center gap-2">
          <span id="netStatusDot" class="w-3.5 h-3.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="netStatusText" class="text-xs font-bold text-emerald-400">ONLINE</span>
        </div>
        <div id="pendingCountBadge" class="hidden px-2.5 py-1 bg-amber-500/20 border border-amber-500/40 text-amber-400 text-xs font-bold rounded-lg cursor-pointer transition hover:bg-amber-500/30" onclick="syncPendingData()">
          ค้างส่ง <span id="pendingNum">0</span> รายการ (แตะเพื่อซิงค์)
        </div>
      </div>

      <!-- สลับจุดปล่อยตัว (START) / เส้นชัย (FINISH) -->
      <div class="grid grid-cols-2 gap-2 bg-slate-950 p-1.5 rounded-xl border border-slate-800 text-center font-bold">
        <button id="btnModeStart" onclick="setMode('START')" class="py-2.5 rounded-lg text-sm transition bg-amber-500 text-slate-950 shadow-md font-black">
          🟢 จุดปล่อยตัว (START)
        </button>
        <button id="btnModeFinish" onclick="setMode('FINISH')" class="py-2.5 rounded-lg text-sm text-slate-400 transition hover:text-white">
          🏁 จุดเส้นชัย (FINISH)
        </button>
      </div>
    </div>

    <!-- กล้องสแกน QR Code -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl text-center">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-semibold text-slate-400">สแกน QR Code ประจำตัวรถ</span>
        <button id="btnToggleCam" onclick="toggleCamera()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 text-amber-400 font-bold transition">
          เปิดกล้องสแกน
        </button>
      </div>
      <!-- บริเวณแสดงวิดีโอกล้อง -->
      <div id="reader-container" class="hidden overflow-hidden rounded-xl bg-black border border-slate-700 max-w-sm mx-auto">
        <div id="reader" class="w-full"></div>
      </div>
    </div>

    <!-- แผงกรอกเบอร์ BIB ด้วยตนเอง (Manual Key-in + Full Numpad 0-9) -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
      <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">ป้อนหมายเลข BIB (คีย์บอร์ด / สัมผัส)</label>
      
      <div class="flex gap-2 mb-3">
        <input type="number" id="inputBib" placeholder="เช่น 101, 205" class="w-full text-3xl font-mono font-black text-center bg-slate-950 border-2 border-slate-700 focus:border-amber-500 rounded-xl py-3 text-white tracking-widest focus:outline-none" onkeydown="if(event.key==='Enter') recordTime()">
        <button onclick="recordTime()" class="w-2/5 bg-amber-500 hover:bg-amber-600 active:scale-95 text-slate-950 font-black text-lg md:text-xl rounded-xl shadow-lg transition">
          บันทึกเวลา
        </button>
      </div>

      <!-- Quick Numpad Buttons (0-9, Backspace, CLR) -->
      <div class="grid grid-cols-3 gap-2">
        <button onclick="appendNum('1')" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 py-3 rounded-xl font-bold text-xl">1</button>
        <button onclick="appendNum('2')" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 py-3 rounded-xl font-bold text-xl">2</button>
        <button onclick="appendNum('3')" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 py-3 rounded-xl font-bold text-xl">3</button>
        
        <button onclick="appendNum('4')" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 py-3 rounded-xl font-bold text-xl">4</button>
        <button onclick="appendNum('5')" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 py-3 rounded-xl font-bold text-xl">5</button>
        <button onclick="appendNum('6')" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 py-3 rounded-xl font-bold text-xl">6</button>
        
        <button onclick="appendNum('7')" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 py-3 rounded-xl font-bold text-xl">7</button>
        <button onclick="appendNum('8')" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 py-3 rounded-xl font-bold text-xl">8</button>
        <button onclick="appendNum('9')" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 py-3 rounded-xl font-bold text-xl">9</button>
        
        <!-- แถวล่างสุด: ลบทีละตัว / เลข 0 / เคลียร์ทั้งหมด -->
        <button onclick="backspaceNum()" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-amber-400 py-3 rounded-xl font-bold text-base flex items-center justify-center">
          ⌫ ลบ
        </button>
        <button onclick="appendNum('0')" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 py-3 rounded-xl font-bold text-xl">0</button>
        <button onclick="clearNum()" class="bg-red-950/60 hover:bg-red-900 border border-red-800 text-red-300 py-3 rounded-xl font-bold text-base">
          CLR
        </button>
      </div>
    </div>

    <!-- รายการประวัติที่กดบันทึกในเครื่องล่าสุด (History) -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">ประวัติการบันทึกเครื่องนี้ (ล่าสุด)</h3>
        <span id="logCount" class="text-xs text-slate-500">0 รายการ</span>
      </div>
      <div id="historyList" class="space-y-2 max-h-56 overflow-y-auto text-sm">
        <div class="text-center py-6 text-slate-600 text-xs">ยังไม่มีประวัติการบันทึก</div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚠️ ระบุ Web App URL ของ Apps Script (ที่ลงท้ายด้วย /exec)
    // ==========================================
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyfD0Q8z-k6lA9j2W6jFpQ4qN6vLq_example/exec';

    let currentMode = 'START';
    let html5QrCode = null;
    let isCamScanning = false;

    // ตัวแปรควบคุมระบบป้องกันการสแกนซ้ำ & ควบคุมลูปกล้อง
    let isProcessingScan = false;
    let lastScannedBib = null;
    let lastScannedTime = 0;
    const DUPLICATE_COOLDOWN_MS = 6000; // ห้ามสแกนเบอร์เดิมซ้ำภายใน 6 วินาที

    // สัญญาณเสียง Beep (Web Audio API)
    function playBeepSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime); // โน้ต A5 ใส ชัดเจน
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15); // ดัง 150ms
      } catch(e) {}
    }

    // ตรวจสอบ Network
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    function updateOnlineStatus() {
      const dot = document.getElementById('netStatusDot');
      const text = document.getElementById('netStatusText');
      if (navigator.onLine) {
        dot.className = "w-3.5 h-3.5 rounded-full bg-emerald-500 animate-pulse";
        text.className = "text-xs font-bold text-emerald-400";
        text.innerText = "ONLINE";
        syncPendingData();
      } else {
        dot.className = "w-3.5 h-3.5 rounded-full bg-red-500";
        text.className = "text-xs font-bold text-red-400";
        text.innerText = "OFFLINE (ทำงานออฟไลน์)";
      }
    }

    function setMode(mode) {
      currentMode = mode;
      const btnStart = document.getElementById('btnModeStart');
      const btnFinish = document.getElementById('btnModeFinish');
      if (mode === 'START') {
        btnStart.className = "py-2.5 rounded-lg text-sm transition bg-amber-500 text-slate-950 shadow-md font-black";
        btnFinish.className = "py-2.5 rounded-lg text-sm text-slate-400 transition hover:text-white";
      } else {
        btnFinish.className = "py-2.5 rounded-lg text-sm transition bg-emerald-500 text-slate-950 shadow-md font-black";
        btnStart.className = "py-2.5 rounded-lg text-sm text-slate-400 transition hover:text-white";
      }
    }

    function appendNum(num) {
      const input = document.getElementById('inputBib');
      input.value = input.value + num;
    }

    function backspaceNum() {
      const input = document.getElementById('inputBib');
      input.value = input.value.slice(0, -1);
    }

    function clearNum() {
      document.getElementById('inputBib').value = '';
    }

    // ฟังก์ชันบันทึกเวลา
    function recordTime(bibValue, isFromCamera = false) {
      const input = document.getElementById('inputBib');
      const bib = (bibValue || input.value).toString().trim();

      if (!bib) {
        Swal.fire({ icon: 'warning', title: 'กรุณาใส่เบอร์ BIB', timer: 1000, showConfirmButton: false });
        return;
      }

      const now = new Date();
      const localTimeString = now.toLocaleTimeString('th-TH', { hour12: false }) + '.' + ('00' + now.getMilliseconds()).slice(-3);
      
      const logRecord = {
        logId: 'LOG-' + Date.now() + '-' + Math.floor(Math.random()*1000),
        bib: bib,
        actionType: currentMode,
        recordedAtLocal: localTimeString,
        rawTimeMs: now.getTime(),
        synced: false
      };

      // บันทึกลง LocalStorage ในเครื่อง
      saveToLocal(logRecord);
      input.value = '';

      // ส่งสัญญาณเสียงและสั่น
      playBeepSound();
      if (navigator.vibrate) navigator.vibrate(100);

      renderHistory();

      // แสดง Popup สรุปเบอร์และเวลา 1.5 วินาที โดยไม่หยุดการทำงานของกล้อง
      const isStart = (currentMode === 'START');
      Swal.fire({
        title: `<div style="font-size: 15px; font-weight: 700; color: ${isStart ? '#f59e0b' : '#10b981'}; text-transform: uppercase; letter-spacing: 1px;">บันทึกจุด ${currentMode} สำเร็จ</div>`,
        html: `
          <div style="font-size: 54px; font-weight: 900; color: #ffffff; font-family: monospace; line-height: 1.1; margin: 8px 0;">
            #${bib}
          </div>
          <div style="font-family: monospace; font-size: 16px; color: #94a3b8; font-weight: bold;">
            ⏱ เวลา ${localTimeString}
          </div>
          <div style="font-size: 11px; color: #64748b; margin-top: 12px;">
            (พร้อมสแกนคันต่อไปต่อเนื่อง...)
          </div>
        `,
        background: '#0f172a',
        showConfirmButton: false,
        timer: 1500,
        timerProgressBar: true,
        willClose: () => {
          // ปลดล็อกให้สแกนคันต่อไปได้ทันที
          isProcessingScan = false;
        }
      });

      // ซิงค์ขึ้น Google Sheets
      if (navigator.onLine) {
        syncPendingData();
      }
    }

    function getStoredLogs() {
      return JSON.parse(localStorage.getItem('timing_logs') || '[]');
    }

    function saveToLocal(item) {
      const list = getStoredLogs();
      list.unshift(item);
      localStorage.setItem('timing_logs', JSON.stringify(list));
      updatePendingBadge();
    }

    function updatePendingBadge() {
      const list = getStoredLogs();
      const pending = list.filter(x => !x.synced);
      const badge = document.getElementById('pendingCountBadge');
      const num = document.getElementById('pendingNum');
      if (pending.length > 0) {
        badge.classList.remove('hidden');
        num.innerText = pending.length;
      } else {
        badge.classList.add('hidden');
      }
    }

    // ซิงค์ข้อมูลขึ้น Google Sheets ผ่าน fetch API (POST JSON)
    function syncPendingData() {
      const list = getStoredLogs();
      const pending = list.filter(x => !x.synced);
      if (pending.length === 0 || !navigator.onLine) return;

      const badge = document.getElementById('pendingCountBadge');
      if (badge) badge.innerText = 'กำลังส่งข้อมูล... ⏳';

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'cors',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'logTiming',
          records: pending
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res && res.success) {
          const updated = list.map(item => ({ ...item, synced: true }));
          localStorage.setItem('timing_logs', JSON.stringify(updated));
          updatePendingBadge();
          renderHistory();
        } else {
          updatePendingBadge();
        }
      })
      .catch(err => {
        console.error('Sync pending logs error:', err);
        updatePendingBadge();
      });
    }

    function renderHistory() {
      const list = getStoredLogs();
      const container = document.getElementById('historyList');
      document.getElementById('logCount').innerText = list.length + ' รายการ';
      if (list.length === 0) {
        container.innerHTML = '<div class="text-center py-6 text-slate-600 text-xs">ยังไม่มีประวัติการบันทึก</div>';
        return;
      }
      let html = '';
      list.slice(0, 15).forEach(x => {
        const isStart = (x.actionType === 'START');
        html += `
          <div class="flex justify-between items-center p-2.5 bg-slate-950/60 rounded-xl border border-slate-800">
            <div class="flex items-center gap-3">
              <span class="px-2 py-0.5 rounded text-xs font-black ${isStart ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'}">
                ${x.actionType}
              </span>
              <span class="text-xl font-black font-mono text-white">#${x.bib}</span>
            </div>
            <div class="text-right">
              <div class="font-mono text-xs text-slate-300 font-bold">${x.recordedAtLocal}</div>
              <div class="text-[10px] ${x.synced ? 'text-emerald-400' : 'text-amber-400'}">
                ${x.synced ? '✓ Cloud Synced' : '● บันทึกในเครื่อง'}
              </div>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // เปิด/ปิดกล้อง และสแกน QR Code แบบลื่นไหลไม่ค้าง pause
   // เปิด/ปิดกล้อง และสแกน QR Code แบบปรับขนาดกล้องอัตโนมัติ
    function toggleCamera() {
      const container = document.getElementById('reader-container');
      const btn = document.getElementById('btnToggleCam');

      if (!isCamScanning) {
        container.classList.remove('hidden');
        btn.innerText = 'กำลังเปิดกล้อง...';

        // เคลียร์ตัวอ่านเดิมก่อนสร้างใหม่ ป้องกันอินสแตนซ์ค้าง
        if (html5QrCode) {
          try { html5QrCode.clear(); } catch(e){}
        }

        html5QrCode = new Html5Qrcode("reader");

        // คำนวณกรอบสแกนตามความกว้างจอจริง (สแกนง่ายและไม่พังบนมือถือ)
        const qrBoxFunction = function(viewfinderWidth, viewfinderHeight) {
          const minEdgePercentage = 0.7; // ใช้พื้นที่ 70% ของจอ
          const minEdgeSize = Math.min(viewfinderWidth, viewfinderHeight);
          const qrboxSize = Math.floor(minEdgeSize * minEdgePercentage);
          return {
            width: qrboxSize,
            height: qrboxSize
          };
        };

        const config = {
          fps: 15,
          qrbox: qrBoxFunction,
          aspectRatio: 1.0
        };

        html5QrCode.start(
          { facingMode: "environment" }, // บังคับใช้กล้องหลัง
          config,
          (decodedText) => {
            const now = Date.now();

            if (isProcessingScan) return;

            let bibMatch = decodedText.match(/\d+/);
            let bib = bibMatch ? bibMatch[0] : null;

            if (!bib) return;

            // คูลดาวน์ 6 วินาที ป้องกันเบอร์เดิมยิงซ้ำ
            if (bib === lastScannedBib && (now - lastScannedTime) < DUPLICATE_COOLDOWN_MS) {
              return;
            }

            isProcessingScan = true;
            lastScannedBib = bib;
            lastScannedTime = now;

            recordTime(bib, true);
          },
          (errorMessage) => {}
        ).then(() => {
          btn.innerText = 'ปิดกล้อง';
          btn.classList.remove('text-amber-400', 'bg-slate-800');
          btn.classList.add('bg-red-600', 'text-white');
          isCamScanning = true;
        }).catch(err => {
          console.error("Camera start error:", err);
          container.classList.add('hidden');
          btn.innerText = 'เปิดกล้องสแกน';
          btn.classList.remove('bg-red-600', 'text-white');
          btn.classList.add('text-amber-400', 'bg-slate-800');
          isCamScanning = false;
          Swal.fire({
            icon: 'error',
            title: 'เปิดกล้องไม่สำเร็จ',
            text: 'กรุณาอนุญาตสิทธิ์เข้าถึงกล้องบนเบราว์เซอร์ (' + err + ')'
          });
        });

      } else {
        if (html5QrCode) {
          html5QrCode.stop().then(() => {
            html5QrCode.clear();
            container.classList.add('hidden');
            btn.innerText = 'เปิดกล้องสแกน';
            btn.classList.remove('bg-red-600', 'text-white');
            btn.classList.add('text-amber-400', 'bg-slate-800');
            isCamScanning = false;
            isProcessingScan = false;
          }).catch(err => console.error(err));
        }
      }
    }

    window.onload = function() {
      updateOnlineStatus();
      updatePendingBadge();
      renderHistory();
    };
  </script>
</body>
</html>
