<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>รายชื่อผู้สมัครแยกตามรุ่น - ป่าแป๋เอ็นดูโร่</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Kanit', sans-serif; background-color: #0b0f19; color: #f8fafc; padding: 15px; }
    .container { max-width: 800px; margin: 0 auto; }
    
    .header-box { background: #131b2e; border: 1px solid #1e293b; border-radius: 20px; padding: 20px; margin-bottom: 16px; text-align: center; }
    .title-h1 { font-size: 22px; font-weight: 900; color: #f59e0b; }
    
    /* Tabs */
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 16px; }
    .tab-btn { background: #131b2e; border: 1px solid #1e293b; color: #94a3b8; padding: 10px 16px; border-radius: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; font-size: 13px; transition: 0.2s; font-family: 'Kanit', sans-serif; }
    .tab-btn.active { background: #f59e0b; color: #020617; border-color: #f59e0b; font-weight: 900; }
    
    /* Team Card List */
    .team-grid { display: flex; flex-direction: column; gap: 12px; }
    .team-card { background: #131b2e; border: 1px solid #1e293b; border-radius: 18px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .team-info { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .team-name { font-size: 17px; font-weight: 900; color: #ffffff; }
    
    /* Driver Tags */
    .drivers-box { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
    .driver-tag { font-size: 13px; color: #cbd5e1; display: flex; align-items: center; gap: 6px; }
    .driver-badge { font-size: 11px; padding: 1px 7px; border-radius: 6px; font-weight: bold; background: #1e293b; color: #94a3b8; }
    .badge-cross { color: #f59e0b; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; display: inline-block; width: fit-content; }
    
    .bib-badge { font-family: monospace; font-size: 22px; font-weight: 900; color: #f59e0b; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); padding: 6px 14px; border-radius: 14px; white-space: nowrap; }
    
    .empty-state { text-align: center; padding: 40px; color: #64748b; background: #131b2e; border-radius: 16px; border: 1px solid #1e293b; }
    .btn-retry { margin-top: 10px; background: #f59e0b; color: #000; border: none; padding: 6px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: 'Kanit'; }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="header-box">
      <h1 class="title-h1">🏍️️ รายชื่อทีมและนักแข่งที่ลงทะเบียน</h1>
      <div style="font-size: 13px; color: #94a3b8; margin-top: 4px;">มิตติ้งป่าแป๋เอ็นดูโร่ | อัปเดตรายชื่อล่าสุด</div>
    </div>

    <!-- ปุ่มเลือกดูตามรุ่น -->
    <div class="tabs">
      <button onclick="switchTab('รุ่นที่ 1')" id="tab_1" class="tab-btn active">รุ่น 1: โอเพ่น</button>
      <button onclick="switchTab('รุ่นที่ 2')" id="tab_2" class="tab-btn">รุ่น 2: Production</button>
      <button onclick="switchTab('รุ่นที่ 3')" id="tab_3" class="tab-btn">รุ่น 3: บังลม</button>
      <button onclick="switchTab('รุ่นที่ 4')" id="tab_4" class="tab-btn">รุ่น 4: ขี่เดี่ยว</button>
      <button onclick="switchTab('รุ่นที่ 5')" id="tab_5" class="tab-btn">รุ่น 5: แอ่วดอย</button>
    </div>

    <!-- รายการทีม -->
    <div id="teamList" class="team-grid">
      <div class="empty-state">กำลังดึงข้อมูลรายชื่อทีม...</div>
    </div>

  </div>

  <script>
    // ⚠️ ใส่ Web App URL ของ Apps Script (ที่ลงท้ายด้วย /exec) ของคุณตรงนี้
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzzUwHYkF7eiFo-F2OR7A-Ht-Uo5_Oizb6LQhiezq2MWQX4wXJZm2dGW8-PnFVhPsK-/exec'; 

    let currentCat = 'รุ่นที่ 1';
    let allRacersList = [];

    window.onload = function() {
      fetchTeams();
    };

    function switchTab(cat) {
      currentCat = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const tabMap = {
        'รุ่นที่ 1': 'tab_1',
        'รุ่นที่ 2': 'tab_2',
        'รุ่นที่ 3': 'tab_3',
        'รุ่นที่ 4': 'tab_4',
        'รุ่นที่ 5': 'tab_5'
      };
      if (document.getElementById(tabMap[cat])) {
        document.getElementById(tabMap[cat]).classList.add('active');
      }
      renderTeams();
    }

    function fetchTeams() {
      const container = document.getElementById('teamList');
      container.innerHTML = '<div class="empty-state">กำลังดึงข้อมูลรายชื่อทีม...</div>';

      // เรียก searchTicket API เดิมที่มีข้อมูลนักแข่งครบ 3 คน
      const requestUrl = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.includes('?') ? '&' : '?') + 'api=searchTicket&q=&t=' + new Date().getTime();

      fetch(requestUrl, {
        method: 'GET',
        redirect: 'follow'
      })
      .then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(res => {
        if (res && res.success) {
          allRacersList = res.data || [];
          renderTeams();
        } else {
          throw new Error(res ? res.message : 'Invalid response');
        }
      })
      .catch(err => {
        console.error('Fetch error:', err);
        container.innerHTML = `
          <div class="empty-state" style="color:#ef4444;">
            ไม่สามารถเชื่อมต่อข้อมูลได้ (${err.message})<br>
            <button onclick="fetchTeams()" class="btn-retry">🔄 ลองใหม่อีกครั้ง</button>
          </div>
        `;
      });
    }

    function renderTeams() {
      const container = document.getElementById('teamList');

      // กรองเฉพาะสถานะ Approved และมีเบอร์ BIB แล้ว
      const approvedList = allRacersList.filter(item => item.status === 'Approved' && item.bib);

      // กรองตามรุ่นที่เลือก (รวมทีมที่ลงควบรุ่น 1 ด้วย)
      const list = approvedList.filter(item => {
        if (currentCat === 'รุ่นที่ 1') {
          return (item.category && item.category.indexOf('รุ่นที่ 1') !== -1) || item.crossClass1;
        } else {
          return item.category && item.category.indexOf(currentCat) !== -1;
        }
      });

      // จัดเรียงตามเบอร์ BIB จากน้อยไปมาก
      list.sort((a, b) => (parseInt(a.bib) || 0) - (parseInt(b.bib) || 0));

      if (list.length === 0) {
        container.innerHTML = `<div class="empty-state">ยังไม่มีรายชื่อทีมที่ได้รับการอนุมัติใน ${currentCat}</div>`;
        return;
      }

      let html = '';
      list.forEach((item, index) => {
        // ดึงรายชื่อนักแข่งทุกคนที่มีข้อมูล
        let driversHtml = '';
        
        if (item.driver1 && item.driver1.name) {
          const bikeInfo = item.driver1.bike ? `(${item.driver1.bike})` : '';
          driversHtml += `<div class="driver-tag"><span class="driver-badge">1</span> ${item.driver1.name} <span style="font-size:11px; color:#94a3b8;">${bikeInfo}</span></div>`;
        }
        if (item.driver2 && item.driver2.name) {
          const bikeInfo = item.driver2.bike ? `(${item.driver2.bike})` : '';
          driversHtml += `<div class="driver-tag"><span class="driver-badge">2</span> ${item.driver2.name} <span style="font-size:11px; color:#94a3b8;">${bikeInfo}</span></div>`;
        }
        if (item.driver3 && item.driver3.name) {
          const bikeInfo = item.driver3.bike ? `(${item.driver3.bike})` : '';
          driversHtml += `<div class="driver-tag"><span class="driver-badge">3</span> ${item.driver3.name} <span style="font-size:11px; color:#94a3b8;">${bikeInfo}</span></div>`;
        }

        html += `
          <div class="team-card">
            <div class="team-info">
              <div class="team-name">${index + 1}. ${item.teamName}</div>
              ${item.crossClass1 && currentCat === 'รุ่นที่ 1' ? '<div class="badge-cross">★ ลงควบรุ่นโอเพ่น</div>' : ''}
              <div class="drivers-box">
                ${driversHtml || '<span style="font-size:12px; color:#64748b;">ไม่มีข้อมูลนักแข่ง</span>'}
              </div>
            </div>
            <div>
              <span class="bib-badge">#${item.bib}</span>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }
  </script>
</body>
</html>
