<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>กำลังพาท่านไปยังหน้าสมัคร - ป่าแป๋เอ็นดูโร่</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: 'Kanit', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .box {
      background: #131b2e;
      border: 1px solid #1e293b;
      border-radius: 20px;
      padding: 30px 20px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #1e293b;
      border-top: 4px solid #f59e0b;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .btn-manual {
      display: inline-block;
      margin-top: 16px;
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #020617;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="box">
    <div class="spinner"></div>
    <h2 style="font-size: 18px; font-weight: 900; color: #ffffff;">กำลังเข้าสู่ระบบรับสมัคร</h2>
    <p style="font-size: 13px; color: #94a3b8; margin-top: 6px;">ระบบกำลังเปิดในเบราว์เซอร์ของท่าน...</p>
    
    <div style="margin-top: 20px;">
      <a id="directLink" href="#" class="btn-manual">แตะที่นี่เพื่อไปหน้าสมัครทันที</a>
    </div>
  </div>

  <script>
    // ⚠️ นำ URL Web App ของ Apps Script (ที่ลงท้ายด้วย /exec) มาวางตรงนี้
    const TARGET_URL = 'https://script.google.com/macros/s/AKfycbzzUwHYkF7eiFo-F2OR7A-Ht-Uo5_Oizb6LQhiezq2MWQX4wXJZm2dGW8-PnFVhPsK-/exec';

    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const isAndroid = /android/i.test(userAgent);
    const isFB = /FBAN|FBAV/i.test(userAgent);

    document.getElementById('directLink').href = TARGET_URL;

    // สำหรับ Android ในแอป Facebook: สั่ง Intent บังคับเปิดด้วย Chrome ทันที
    if (isAndroid && isFB) {
      const cleanUrl = TARGET_URL.replace(/^https?:\/\//, '');
      const intentUrl = 'intent://' + cleanUrl + '#Intent;scheme=https;package=com.android.chrome;end';
      window.location.href = intentUrl;
    } else {
      // สำหรับ iPhone หรือเปิดทั่วไป: Redirect ปกติ
      setTimeout(function() {
        window.location.href = TARGET_URL;
      }, 300);
    }
  </script>
</body>
</html>
